packages:
  - docs
  - template

allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - sharp
  - unrs-resolver
  - vue-demi

overrides:
  undocs: link:.

minimumReleaseAgeExclude:
  - "nitro-nightly*"
  - crossws@0.4.12
  - db0@0.4.0
  - env-runner@0.2.0
  - h3@2.0.1-rc.29
  - srvx@0.12.7
  - unstorage@2.0.0-alpha.9
  - "@i18n-micro/core@1.3.14"
  - "@i18n-micro/vue@1.3.12 || 1.4.0"
