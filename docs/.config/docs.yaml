# yaml-language-server: $schema=https://unpkg.com/undocs/schema/config.json

name: "UnDocs"
shortDescription: "Docs, made easy."
description: "Elegant documentation tooling for UnJS ecosystem."
github: "unjs/undocs"
lang: en
i18n:
  defaultLocale: en
  strategy: prefix_except_default
  locales:
    - code: en
      iso: en-US
      displayName: English
    - code: ru
      iso: ru-RU
      displayName: Русский
      name: "UnDocs"
      shortDescription: "Документация без боли."
      description: "Элегантный тулинг документации для экосистемы UnJS."
      landing:
        heroTitle: "Документация UnDocs"
        heroSubtitle: "Документация без боли."
        heroDescription: "Элегантный тулинг документации для экосистемы UnJS."
        features:
          - title: "Просто использовать"
            icon: "⚡"
            description: "Пишите *документацию* в Markdown — не возитесь с тулингом."
          - title: "Nitro + Vite"
            icon: "logos:vitejs"
            description: "На [Nitro](https://nitro.build), [Vite](https://vite.dev) и [Vue](https://vuejs.org)."
          - title: "Деплой куда угодно"
            icon: "✨"
            description: "Документацию можно разместить на любом static-хостинге."
# themeColor: blue
socials:
  x: "https://x.com/unjsio"
  bluesky: "https://bsky.app/profile/unjs.io"
  discord: "#"
sponsors:
  api: https://sponsors.pi0.io/sponsors.json
url: "https://undocs.pages.dev"
redirects:
  "/docs": "/guide"
  "/ru/docs": "/ru/guide"
automd: true
landing:
  heroLinks:
    stackblitz:
      icon: "i-lucide-play"
      to: "https://stackblitz.com/github/unjs/undocs/tree/main/template"
  heroCode: "npx giget gh:unjs/undocs/template docs --install"
  contributors: true
  features:
    - title: "Easy to use"
      icon: "⚡"
      description: "Focus on writing your *documentation* with Markdown, not tooling."
    - title: "Nitro + Vite powered"
      icon: "logos:vitejs"
      description: "Made with [Nitro](https://nitro.build), [Vite](https://vite.dev), and [Vue](https://vuejs.org)."
    - title: "Deploy anywhere"
      icon: "✨"
      description: "The documentation can be hosted on any static hosting."
